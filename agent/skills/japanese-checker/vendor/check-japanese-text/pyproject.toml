[project]
name = "check-japanese-text"
version = "0.1.0"
description = "Detect Chinese-language contamination in Japanese text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sudachipy>=0.6.8,<0.7",
    "sudachidict-small>=20250000",
]

[project.scripts]
check-japanese-text = "japanese_checker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/japanese_checker"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
