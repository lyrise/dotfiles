# Local descriptions reapplied after `./setup.py update` replaces vendored skills.

[skills.adversarial-panel]
description = "Run a multi-model adversarial review when the user explicitly requests competing perspectives, a red team, or calibrated uncertainty."

[skills.cognitive-rhythm-writing]
description = "Improve rhythm in explanatory Japanese prose when the user explicitly wants a more engaging, less flat reading experience."

[skills.handoff]
description = "Create a context handoff prompt when the user asks to transfer work to another agent or chat."

[skills.japanese-tech-writing]
description = "Write or revise reader-facing Japanese technical prose when the user asks for a technical article, chapter, or explanation."

[skills.onboard]
description = "Inspect an unfamiliar repository when the user asks for orientation, a summary, or an onboarding pass."

[skills.playwright-cli]
description = "Use playwright-cli to automate browser UI or run and debug Playwright tests when the task requires browser interaction."

[skills.sanitize-artifacts]
